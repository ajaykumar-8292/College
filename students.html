<!-- Main -->

<div class="main">

<div class="topbar">

<h1>Student Management</h1>

<input
type="text"
id="searchStudent"
placeholder="Search Student">

</div>

<!-- Add Student -->

<div class="student-form">

<h2>Add Student</h2>

<form id="studentForm">

<input
type="text"
id="name"
placeholder="Student Name"
required>

<input
type="text"
id="roll"
placeholder="Roll Number"
required>

<input
type="text"
id="course"
placeholder="Course"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<button type="submit">

Add Student

</button>

</form>

</div>

<!-- Student Table -->

<div class="student-table">

<h2>Student List</h2>

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Roll</th>
<th>Course</th>
<th>Email</th>
<th>Action</th>

</tr>

</thead>
