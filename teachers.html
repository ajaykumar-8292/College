<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Management | College Management System</title>

    <link rel="stylesheet" href="teachers.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>CollegeMS</h2>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="students.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    Students
                </a>
            </li>

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-chalkboard-user"></i>
                    Teachers
                </a>
            </li>

            <li>
                <a href="attendance.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Attendance
                </a>
            </li>

            <li>
                <a href="fees.html">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    Fees
                </a>
            </li>

            <li>
                <a href="results.html">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                    Results
                </a>
            </li>

            <li>
                <a href="login.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main">

        <!-- Topbar -->

        <div class="topbar">

            <h1>Teacher Management</h1>

            <input
                type="text"
                id="searchTeacher"
                placeholder="Search Teacher...">

        </div>

        <!-- Teacher Form -->

        <section class="teacher-form">

            <h2>Add New Teacher</h2>

            <form id="teacherForm">

                <input
                    type="text"
                    id="teacherName"
                    placeholder="Teacher Name"
                    required>

                <input
                    type="text"
                    id="teacherId"
                    placeholder="Teacher ID"
                    required>

                <input
                    type="text"
                    id="teacherSubject"
                    placeholder="Subject"
                    required>

                <input
                    type="email"
                    id="teacherEmail"
                    placeholder="Email Address"
                    required>

                <input
                    type="tel"
                    id="teacherPhone"
                    placeholder="Mobile Number"
                    required>

                <button type="submit">
                    <i class="fa-solid fa-plus"></i>
                    Add Teacher
                </button>

            </form>

        </section>

        <!-- Teacher Table -->

        <section class="teacher-table">

            <h2>Teacher List</h2>

            <table>

                <thead>

                    <tr>

                        <th>#</th>
                        <th>Name</th>
                        <th>Teacher ID</th>
                        <th>Subject</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="teacherTable">

                    <!-- JavaScript Data -->

                </tbody>

            </table>

        </section>

    </main>

    <script src="teachers.js"></script>

</body>

</html>
